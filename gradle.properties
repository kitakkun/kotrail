# Build with JDK 21. The Kotlin compiler bundled in Gradle cannot parse Java 25's version string
# (IllegalArgumentException: 25.0.2), so a machine whose default JDK is 25 pins the launcher in
# its own ~/.gradle/gradle.properties: org.gradle.java.home=<path to a JDK 21>. CI does the same.
org.gradle.jvmargs=-Xmx2g
kotlin.code.style=official

# The Kotlin compiler version defaults to the newest published one (settings.gradle.kts).
# Override per invocation with -Pkotlin.compiler=<version>. See docs/supported-kotlin-versions.md.

# Run kotlinc inside the Gradle worker JVM. Flipping kotlin.compiler between builds otherwise
# leaves several Kotlin daemons around and Gradle warns about multiple daemon sessions.
kotlin.compiler.execution.strategy=in-process
