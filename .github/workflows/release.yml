name: Release

# Pushing a tag such as v0.1.0 publishes that version. The compiler plugin is built and published
# once per supported Kotlin version, because its JAR links against one compiler; the annotations
# and the Gradle plugin are Kotlin-version independent and are published once. Each job uploads
# its own Central Portal deployment and releases it.
#
# Credentials are environment secrets of the `release` environment, which is also where an
# approval gate (required reviewers) can be put in front of publishing. See docs/publishing.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  compiler-plugin:
    name: Compiler plugin for Kotlin ${{ matrix.kotlin }}
    needs: version
    runs-on: ubuntu-latest
    environment: release
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with publishedKotlinVersions in build.gradle.kts.
        kotlin: [2.3.21, 2.4.0, 2.4.10, 2.4.20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: >-
          ./gradlew build --console=plain
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Pkotlin.compiler=${{ matrix.kotlin }}
          -Pkotrail.version=${{ needs.version.outputs.version }}
      - name: Publish kotrail-compiler-plugin ${{ matrix.kotlin }}-${{ needs.version.outputs.version }}
        run: >-
          ./gradlew :compiler-plugin:publishAndReleaseToMavenCentral --console=plain --no-configuration-cache
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Pkotlin.compiler=${{ matrix.kotlin }}
          -Pkotrail.version=${{ needs.version.outputs.version }}

  libraries:
    name: Annotations and Gradle plugin
    needs: [version, compiler-plugin]
    runs-on: ubuntu-latest
    environment: release
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish kotrail-annotations and kotrail-gradle-plugin to Maven Central
        run: >-
          ./gradlew :annotations:publishAndReleaseToMavenCentral :gradle-plugin:publishAndReleaseToMavenCentral
          --console=plain --no-configuration-cache
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Pkotrail.version=${{ needs.version.outputs.version }}
      - name: Publish the Gradle plugin to the Plugin Portal
        run: >-
          ./gradlew :gradle-plugin:publishPlugins --console=plain --no-configuration-cache
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Pkotrail.version=${{ needs.version.outputs.version }}
          -Pgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }}
          -Pgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }}
