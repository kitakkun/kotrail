name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kotlin ${{ matrix.kotlin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kotlin: [2.3.21, 2.4.0, 2.4.10, 2.4.20]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins org.gradle.java.home to a local JDK for development machines;
      # override it with the JDK this job installed.
      - name: Build against Kotlin ${{ matrix.kotlin }}
        run: >-
          ./gradlew build --console=plain --stacktrace
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Pkotlin.compiler=${{ matrix.kotlin }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-kotlin-${{ matrix.kotlin }}
          path: '**/build/reports/tests/**'
