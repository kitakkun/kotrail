name: Docs

# Builds the VitePress site under docs-site from the Markdown under docs on every change, which
# also checks the documentation's cross-links. Publishing to GitHub Pages is switched on with the
# repository variable PUBLISH_DOCS=true, with Pages enabled and "GitHub Actions" as its source.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'docs-site/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npm run docs:build
        working-directory: docs-site
      - if: vars.PUBLISH_DOCS == 'true'
        uses: actions/configure-pages@v5
      - if: vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    if: vars.PUBLISH_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
